name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore MYG.Electrical.slnx
      - name: Build
        run: dotnet build MYG.Electrical.slnx -c Release --no-restore
      - name: Test
        run: dotnet test --solution MYG.Electrical.slnx -c Release --no-build
